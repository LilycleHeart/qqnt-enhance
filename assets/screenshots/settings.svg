<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231b38"/><stop offset="1" stop-color="#3f2b4e"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48bd8"/><stop offset="1" stop-color="#d98bc0"/>
    </linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="760" height="420" rx="14" fill="url(#w3)"/>
  <circle cx="660" cy="60" r="130" fill="#ffffff" opacity="0.045"/>

  <!-- nav -->
  <rect x="14" y="14" width="180" height="392" rx="12" fill="url(#g3)" filter="url(#s3)"/>
  <g opacity="0.5" fill="#ffffff">
    <rect x="28" y="40" width="110" height="8" rx="4"/>
    <rect x="28" y="70" width="90" height="8" rx="4"/>
  </g>
  <rect x="22" y="96" width="164" height="34" rx="9" fill="#ffffff" opacity="0.16"/>
  <path d="M38 107 l6 6 6 -6 m-6 6 v8" stroke="#d98bc0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="58" y="118" font-size="13" font-weight="700" fill="#ffffff">QQ 增强</text>
  <g opacity="0.5" fill="#ffffff">
    <rect x="28" y="148" width="100" height="8" rx="4"/>
    <rect x="28" y="178" width="80" height="8" rx="4"/>
  </g>

  <!-- panel -->
  <rect x="210" y="14" width="536" height="392" rx="12" fill="url(#g3)" filter="url(#s3)"/>
  <text x="234" y="48" font-size="16" font-weight="700" fill="#ffffff">QQ 增强 · 功能</text>
  <rect x="234" y="60" width="488" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- toggle rows -->
  <g>
    <text x="234" y="96" font-size="13.5" font-weight="600" fill="#f0eaf6">🛡️ 防撤回</text>
    <text x="234" y="113" font-size="11" fill="#cdbfe0" opacity="0.8">别人撤回的消息照常显示，标「已撤回 · 撤回人」</text>
    <rect x="684" y="90" width="38" height="20" rx="10" fill="url(#b3)"/><circle cx="712" cy="100" r="8" fill="#fff"/>
  </g>
  <rect x="234" y="130" width="488" height="1" fill="#ffffff" opacity="0.08"/>
  <g>
    <text x="234" y="160" font-size="13.5" font-weight="600" fill="#f0eaf6">📍 记住浏览位置</text>
    <text x="234" y="177" font-size="11" fill="#cdbfe0" opacity="0.8">切回会话时停在上次看到的地方</text>
    <rect x="684" y="154" width="38" height="20" rx="10" fill="url(#b3)"/><circle cx="712" cy="164" r="8" fill="#fff"/>
  </g>
  <rect x="234" y="194" width="488" height="1" fill="#ffffff" opacity="0.08"/>
  <g>
    <text x="234" y="224" font-size="13.5" font-weight="600" fill="#f0eaf6">🔁 右键复读</text>
    <text x="234" y="241" font-size="11" fill="#cdbfe0" opacity="0.8">右键菜单「转发」下面加「复读」</text>
    <rect x="684" y="218" width="38" height="20" rx="10" fill="url(#b3)"/><circle cx="712" cy="228" r="8" fill="#fff"/>
  </g>
  <rect x="234" y="258" width="488" height="1" fill="#ffffff" opacity="0.08"/>
  <g>
    <text x="234" y="288" font-size="13.5" font-weight="600" fill="#f0eaf6">💬 引用时不带 @</text>
    <text x="234" y="305" font-size="11" fill="#cdbfe0" opacity="0.8">点「引用」后删掉自动插入的 @对方</text>
    <rect x="684" y="282" width="38" height="20" rx="10" fill="#ffffff" opacity="0.22"/><circle cx="694" cy="292" r="8" fill="#fff" opacity="0.85"/>
  </g>

  <!-- storage stats -->
  <rect x="234" y="330" width="488" height="56" rx="10" fill="#ffffff" opacity="0.07"/>
  <text x="250" y="354" font-size="12" fill="#f0eaf6">防撤回已保存 <tspan font-weight="700" fill="#d98bc0">128</tspan> 条原文 · <tspan font-weight="700" fill="#d98bc0">0.4 MB</tspan></text>
  <rect x="620" y="346" width="86" height="26" rx="8" fill="#e5737a" opacity="0.85"/>
  <text x="638" y="363" font-size="11.5" fill="#fff" font-weight="600">清空</text>
</svg>
