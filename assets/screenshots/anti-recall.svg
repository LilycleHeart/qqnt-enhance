<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="wa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231b38"/><stop offset="1" stop-color="#3f2b4e"/>
    </linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="sa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="760" height="300" rx="14" fill="url(#wa)"/>

  <!-- left: without -->
  <text x="40" y="40" font-size="13" font-weight="700" fill="#ffffff" opacity="0.6">原生 QQ</text>
  <rect x="40" y="56" width="300" height="200" rx="12" fill="#ffffff" opacity="0.04"/>
  <text x="130" y="150" font-size="12" fill="#9c93b5">— 对方撤回了一条消息 —</text>
  <text x="112" y="172" font-size="11" fill="#7d7595">内容看不到了</text>

  <!-- arrow -->
  <path d="M360 156 h40" stroke="#d98bc0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M396 150 l8 6 -8 6" stroke="#d98bc0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: with plugin -->
  <text x="420" y="40" font-size="13" font-weight="700" fill="#d98bc0">装了 QQ 增强</text>
  <rect x="420" y="56" width="300" height="200" rx="12" fill="#ffffff" opacity="0.04"/>
  <g filter="url(#sa)">
    <rect x="440" y="110" width="262" height="78" rx="14" fill="url(#ga)" stroke="#e5a6cf" stroke-dasharray="4 4" stroke-opacity="0.75"/>
  </g>
  <circle cx="462" cy="134" r="12" fill="#b48bd8"/>
  <text x="482" y="130" font-size="12" font-weight="700" fill="#e5a6cf">小赤羽</text>
  <text x="482" y="150" font-size="12.5" fill="#f3eef8">刚才那条我不该发的…</text>
  <text x="482" y="170" font-size="10" fill="#e5a6cf" opacity="0.9">已撤回 · 小赤羽</text>

  <text x="40" y="285" font-size="10" fill="#ffffff" opacity="0.4">示意图 · 防撤回：对方撤回后消息仍以虚线框保留，并标注撤回人</text>
</svg>
